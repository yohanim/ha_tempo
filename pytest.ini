[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = .
# The suite uses its own lightweight ``hass`` fixture (tests/conftest.py), not the
# pytest-homeassistant plugin; its helpers (pytest_homeassistant.common) are
# imported directly. respx's plugin is off so Home Assistant can install its
# httpx alias before httpx is imported (HA 2026.11+).
addopts = -p no:pytest_homeassistant -p no:socket -p no:respx
filterwarnings =
    ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning
    # Third-party (backoff, pulled in by homeassistant); not our code.
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff\..*
