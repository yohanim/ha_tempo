[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = .
addopts = -p no:homeassistant -p no:socket
filterwarnings =
    ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning
    # Third-party (backoff, pulled in by homeassistant); not our code.
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff\..*
